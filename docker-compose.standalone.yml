name: global-booking-reconciliation-standalone

services:
  finance-control-tower:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.standalone
    environment:
      FINANCE_RUNTIME_MODE: local_native
      FINANCE_API_HOST: 0.0.0.0
      FINANCE_API_PORT: "8040"
      FINANCE_ADMIN_API_KEY: ${FINANCE_ADMIN_API_KEY:-dev-finance-admin-key-change-me}
      FINANCE_AUDITOR_API_KEY: ${FINANCE_AUDITOR_API_KEY:-dev-finance-auditor-key-change-me}
      FINANCE_READER_API_KEY: ${FINANCE_READER_API_KEY:-dev-finance-reader-key-change-me}
    ports:
      - "127.0.0.1:8040:8040"
    volumes:
      - standalone_warehouse:/app/.local_data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8040/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536m

volumes:
  standalone_warehouse:
