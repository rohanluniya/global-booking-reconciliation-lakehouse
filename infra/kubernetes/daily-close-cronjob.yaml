apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-financial-close
  namespace: booking-finance-lakehouse
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: close-runner
              image: ghcr.io/ankdeshm/global-booking-reconciliation-lakehouse:0.1.0
              command: ["python", "scripts/run_pipeline.py", "--export-results"]
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "2000m"
                  memory: "2Gi"
